<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0">
<title>杜姣 · AI-Native 产品经理｜作品集短片</title>
<meta name="description" content="杜姣 · AI-Native 产品经理作品集短片。意图即界面：用 AI 原生思维，重做产品本质。">
<meta property="og:title" content="杜姣 · AI-Native 产品经理｜作品集短片">
<meta property="og:description" content="意图即界面：用 AI 原生思维，重做产品本质。">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="video.other">
<style>
  :root{
    --bg:#070b12;
    --panel:#0d1420;
    --line:rgba(255,255,255,.08);
    --text:#e8eef6;
    --muted:#8b9aae;
    --accent:#8be0f5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(94,184,214,.18), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(56,120,170,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(24px,5vh,64px) 20px clamp(20px,4vh,48px);
    min-height:100%;
  }
  header{text-align:center;margin-bottom:clamp(18px,3.4vh,36px)}
  .name{
    font-size:clamp(24px,3.2vw,34px);
    font-weight:600;letter-spacing:.06em;
    color:var(--accent);
  }
  .role{
    margin-top:10px;
    font-size:clamp(12px,1.4vw,14px);
    letter-spacing:.22em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .tagline{
    margin-top:18px;
    font-size:clamp(15px,1.9vw,19px);
    font-weight:500;
    letter-spacing:.03em;
  }
  .tagline-en{
    margin-top:8px;
    font-size:clamp(10px,1.1vw,12px);
    letter-spacing:.3em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .stage{
    width:min(100%,1080px);
    border-radius:14px;
    overflow:hidden;
    background:#000;
    border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(139,224,245,.05) inset;
    aspect-ratio:16/9;
  }
  video{display:block;width:100%;height:100%;background:#000;outline:none}
  .meta{
    width:min(100%,1080px);
    margin-top:16px;
    display:flex;flex-wrap:wrap;gap:10px 22px;
    align-items:center;justify-content:space-between;
    font-size:13px;color:var(--muted);
  }
  .meta .left{display:flex;gap:18px;flex-wrap:wrap}
  .meta span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7;margin-right:8px;vertical-align:middle}
  .meta .left span:first-child::before{display:none}
  footer{
    margin-top:auto;
    padding-top:clamp(26px,5vh,56px);
    width:min(100%,1080px);
    display:flex;flex-wrap:wrap;gap:8px 20px;
    justify-content:center;align-items:center;
    font-size:12.5px;color:var(--muted);
    letter-spacing:.04em;
  }
  a{color:var(--muted);text-decoration:none;border-bottom:1px solid rgba(139,224,245,.25);transition:color .2s}
  a:hover{color:var(--accent)}
  @media (max-width:640px){
    body{justify-content:flex-start;padding-top:28px}
    .stage{border-radius:10px}
    .tagline{font-size:15px;line-height:1.6}
    .meta{font-size:12px}
    footer{font-size:12px}
  }
</style>
</head>
<body>
  <header>
    <div class="name">杜姣　Jiao Du</div>
    <div class="role">AI-Native 产品经理</div>
    <h1 class="tagline">意图即界面：用 AI 原生思维，重做产品本质</h1>
    <div class="tagline-en">Intent as Interface · Rebuilt for AI</div>
  </header>

  <div class="stage">
    <video
      controls
      playsinline
      preload="metadata"
      poster="poster.jpg"
      controlsList="nodownload">
      <source src="portfolio.mp4" type="video/mp4">
      你的浏览器不支持视频播放，请<a href="portfolio.mp4">下载视频</a>观看。
    </video>
  </div>

  <div class="meta">
    <div class="left">
      <span>作品集短片 · 1′48″</span>
      <span>建议横屏观看</span>
    </div>
    <span>若网络较慢，加载约需数秒</span>
  </div>

  <footer>
    <span>上海</span>
    <a href="mailto:duj_2008@163.com">duj_2008@163.com</a>
  </footer>
</body>
</html>
